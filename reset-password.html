<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set a new password — Solarsearch</title>
<style>
:root{
  --paper:#F7F9F6; --panel:#FFFFFF; --tint:#E8F1EA;
  --ink:#0F2E27; --ink-2:#41615A; --ink-3:#6D8781;
  --line:#DBE5DE; --line-2:#C6D5CC;
  --amber:#FFB100; --amber-deep:#DE8F00;
  --green:#177A53; --green-soft:#E2F2EA;
  --red:#C2452D; --red-soft:#FBEAE6;
  --display:'Bricolage Grotesque',sans-serif;
  --body:'Instrument Sans',sans-serif;
  --radius:14px;
  --shadow-lg:0 2px 4px rgba(15,46,39,.06),0 24px 60px -18px rgba(15,46,39,.24);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--body);background:var(--paper);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:32px}
h1{font-family:var(--display);font-size:1.4rem;margin-bottom:4px}
p.sub{color:var(--ink-3);font-size:.9rem;margin-bottom:24px}
label{display:block;font-size:.82rem;font-weight:600;margin-bottom:6px;margin-top:16px}
input{width:100%;padding:10px 12px;border:1px solid var(--line-2);border-radius:9px;font-family:inherit;font-size:.95rem}
input:focus-visible{outline:3px solid var(--amber);outline-offset:1px}
button{width:100%;margin-top:22px;padding:12px;border:none;border-radius:9px;background:var(--ink);color:#fff;font-weight:700;font-size:.95rem;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
button:hover:not(:disabled){background:var(--green)}
.msg{margin-top:14px;padding:10px 12px;border-radius:9px;font-size:.85rem}
.msg.error{background:var(--red-soft);color:var(--red)}
.msg.ok{background:var(--green-soft);color:var(--green)}
.hint{margin-top:8px;font-size:.78rem;color:var(--ink-3)}
</style>
</head>
<body>
<div class="card">
  <h1>Set a new password</h1>
  <p class="sub">Choose a new password for your Solarsearch account.</p>
  <form id="resetForm">
    <label for="pw1">New password</label>
    <input id="pw1" type="password" required autocomplete="new-password" minlength="10">
    <label for="pw2">Confirm new password</label>
    <input id="pw2" type="password" required autocomplete="new-password" minlength="10">
    <p class="hint">At least 10 characters.</p>
    <button id="submitBtn" type="submit">Save new password</button>
  </form>
  <div id="msg"></div>
  <p style="margin-top:18px;font-size:.85rem;text-align:center"><a href="/login.html" style="color:var(--ink-3);font-weight:600">Back to sign in</a></p>
</div>

<script type="module">
import { getSupabaseClient } from "/src/lib/supabase.js";

const db = getSupabaseClient();
const form = document.getElementById("resetForm");
const msgEl = document.getElementById("msg");
const submitBtn = document.getElementById("submitBtn");

function showMsg(text, kind){ msgEl.textContent = text; msgEl.className = `msg ${kind}`; }

// Supabase turns the emailed link into a recovery session. Without one there is
// nothing to update, so say so rather than failing confusingly on submit.
let hasSession = false;
db.auth.onAuthStateChange((event, session) => { if (session) hasSession = true; });
(async () => {
  const { data } = await db.auth.getSession();
  if (data?.session) { hasSession = true; return; }
  setTimeout(async () => {
    const { data: d2 } = await db.auth.getSession();
    if (!d2?.session) {
      showMsg("This reset link is invalid or has expired. Request a new one from the sign-in page.", "error");
      submitBtn.disabled = true;
    }
  }, 1200);
})();

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const pw1 = document.getElementById("pw1").value;
  const pw2 = document.getElementById("pw2").value;
  if (pw1 !== pw2) { showMsg("Those passwords don't match.", "error"); return; }
  if (pw1.length < 10) { showMsg("Please use at least 10 characters.", "error"); return; }
  if (!hasSession) {
    showMsg("This reset link is invalid or has expired. Request a new one from the sign-in page.", "error");
    return;
  }

  submitBtn.disabled = true;
  showMsg("Saving…", "ok");
  const { error } = await db.auth.updateUser({ password: pw1 });
  if (error) { showMsg(error.message, "error"); submitBtn.disabled = false; return; }

  showMsg("Password updated. Taking you to sign in…", "ok");
  await db.auth.signOut();
  setTimeout(() => { location.href = "/login.html"; }, 1400);
});
</script>
</body>
</html>
